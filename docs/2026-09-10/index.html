<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026年9月10日星期四 - AI + 软件测试 每日资讯</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --accent: #7c3aed;
      --sidebar-w: 220px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    /* ====== Layout ====== */
    .app { display: flex; min-height: 100vh; }

    /* ====== Sidebar ====== */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      padding: 24px 16px;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      overflow-y: auto;
      z-index: 100;
      display: flex;
      flex-direction: column;
    }
    .sidebar-logo {
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(135deg, #7c3aed 0%, #2563eb 50%, #0891b2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.3;
    }
    .sidebar-logo a { text-decoration: none; color: inherit; }

    .date-picker {
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .date-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .date-picker select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      outline: none;
      font-family: inherit;
    }
    .date-picker select:focus { border-color: var(--accent); }

    .side-nav-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .side-nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      overflow-y: auto;
    }
    .side-nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: all 0.12s;
      white-space: nowrap;
    }
    .side-nav-item:hover, .side-nav-item.active {
      background: #ede9fe;
      color: var(--accent);
      font-weight: 600;
    }
    .side-nav-item span {
      font-size: 11px;
      color: #94a3b8;
      background: var(--bg);
      padding: 1px 7px;
      border-radius: 10px;
    }
    .side-nav-item:hover span, .side-nav-item.active span {
      background: #ddd6fe;
      color: var(--accent);
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: #cbd5e1;
      text-align: center;
    }
    .sidebar-footer a { color: #94a3b8; }

    /* ====== Main Content ====== */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      padding: 32px 40px;
      max-width: calc(100vw - var(--sidebar-w));
    }
    .main-header {
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .main-header h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .main-header .subtitle {
      color: var(--text-secondary);
      font-size: 14px;
      margin-top: 6px;
    }
    .update-time {
      display: inline-block;
      margin-top: 10px;
      padding: 3px 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--accent);
      display: inline-block;
    }

    .featured { margin-bottom: 40px; }
    .featured-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .featured-card {
      display: block;
      background: var(--card-bg);
      border-radius: 14px;
      padding: 24px;
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .featured-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(124,58,237,0.12);
      border-color: var(--accent);
    }
    .featured-cat {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 10px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .featured-card h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 10px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .featured-card p {
      font-size: 14px;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .featured-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      font-size: 12px;
      color: #94a3b8;
    }

    .cat-section {
      margin-bottom: 40px;
      scroll-margin-top: 20px;
    }
    .cat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .cat-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .cat-header h3 {
      font-size: 18px;
      font-weight: 700;
    }
    .cat-desc {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .item-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .item-card {
      display: block;
      background: var(--card-bg);
      border-radius: 10px;
      padding: 16px 18px;
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--border);
      transition: all 0.15s;
    }
    .item-card:hover {
      border-color: #c4b5fd;
      background: #faf9ff;
    }
    .item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .item-source {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .item-card h4 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .item-card p {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .score {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
    }
    .score-high { background: #dcfce7; color: #15803d; }
    .score-mid  { background: #fef3c7; color: #b45309; }
    .score-low  { background: #f1f5f9; color: #64748b; }

    .empty { text-align: center; padding: 80px 0; color: #94a3b8; font-size: 16px; }

    /* ====== Mobile ====== */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-left: 0; max-width: 100%; padding: 20px 16px; }
      .main-header h1 { font-size: 22px; }
      .featured-grid { grid-template-columns: 1fr; }
    }

    @media (min-width: 769px) {
      .mobile-toggle { display: none; }
    }</style>
  <script>
    function setActive(el) {
      document.querySelectorAll('.side-nav-item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
    }
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-logo"><a href="../">AI + 测试<br>每日资讯</a></div>
      <div class="side-nav-label">📂 分类导航</div>
      <nav class="side-nav"></nav>
      <div class="sidebar-footer">
        <a href="../">← 返回首页</a><br><br>
        生成时间 (UTC+8)<br>2026-09-10 12:00:02<br><br>
        <span class="status-err">未AI处理</span><br><br>
        数据来源<br>Google News · arXiv<br>Reddit · Semantic Scholar<br><br>
        <a href="https://github.com/cey1117/ai-news">GitHub</a>
      </div>
    </aside>
    <main class="main">
      <div class="main-header">
        <h1>AI + 软件测试 每日资讯</h1>
        <p class="subtitle">聚合 AI 驱动的用例生成、漏洞分析、程序分析、安全扫描、缺陷定位、测试框架、测试工程等领域最新动态</p>
        <div class="update-time">📅 2026年9月10日星期四 12:00 · 共 0 条</div>
      </div>
      
      <div class="empty">暂无内容，请稍后再来查看。</div>
    </main>
  </div>
</body>
</html>
